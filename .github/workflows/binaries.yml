# Spec 0004 (docs/specs/0004-distribution.md): the single binary of the editor, for five targets.
# - build: build the editor, embed it, cross-compile `bun build --compile` for every target on one Linux runner, write
#   SHA256SUMS.txt, check the file types, and run the full smoke on the Linux x64 binary.
# - smoke: each binary is downloaded and started on a runner of its own operating system and architecture, its checksum
#   is verified first. Linux and macOS run the full smoke (including: a non-loopback address refuses the connection;
#   required on Linux), Windows runs `--check` (start, verify over HTTP, exit 0).
# - release: only for a pushed tag `v*`. It creates a DRAFT GitHub release with the binaries and the checksums; the
#   operator publishes it. The macOS and Windows binaries are unsigned (spec 0004).
name: Binaries

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        shell: bash
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Install workspace dependencies
        shell: bash
        run: devenv shell -- bun install --frozen-lockfile
      - name: Build the editor and embed it
        shell: bash
        run: devenv shell -- bun run build
      - name: Cross-compile the five targets
        shell: bash
        working-directory: apps/launcher
        run: |
          set -euo pipefail
          # The host target of a Bun that devenv provides would embed that Bun, whose ELF interpreter is a path in the
          # Nix store: such a binary runs on no other machine. The `baseline` variant is another target, so Bun
          # downloads its own official runtime (interpreter /lib64/ld-linux-x86-64.so.2), and it also runs on CPUs
          # without AVX2.
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64 windows-x64; do
            ext=""
            bun_target="$target"
            [ "$target" = windows-x64 ] && ext=".exe"
            [ "$target" = linux-x64 ] && bun_target="linux-x64-baseline"
            devenv shell -- bun build --compile --target="bun-$bun_target" ./src/compiled.ts \
              --outfile "dist/reebeat-studio-$target$ext"
          done
          cd dist
          rm -f reebeat-studio
          sha256sum reebeat-studio-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          file reebeat-studio-*
      - name: Check the file types
        shell: bash
        run: apps/launcher/scripts/checkFileTypes.sh apps/launcher/dist
      - name: Smoke the Linux x64 binary
        shell: bash
        env:
          REQUIRE_NON_LOOPBACK: "1"
        run: apps/launcher/scripts/smokeBinary.sh apps/launcher/dist/reebeat-studio-linux-x64 full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: |
            apps/launcher/dist/reebeat-studio-*
            apps/launcher/dist/SHA256SUMS.txt
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              target: linux-x64,
              ext: "",
              mode: full,
              require: "1",
            }
          - {
              os: ubuntu-24.04-arm,
              target: linux-arm64,
              ext: "",
              mode: full,
              require: "1",
            }
          - {
              os: macos-latest,
              target: darwin-arm64,
              ext: "",
              mode: full,
              require: "0",
            }
          - {
              os: macos-15-intel,
              target: darwin-x64,
              ext: "",
              mode: full,
              require: "0",
            }
          - {
              os: windows-latest,
              target: windows-x64,
              ext: ".exe",
              mode: check,
              require: "0",
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: binaries
      - name: Verify the checksum
        shell: bash
        working-directory: binaries
        run: |
          set -euo pipefail
          grep " reebeat-studio-${{ matrix.target }}${{ matrix.ext }}\$" SHA256SUMS.txt > one.txt
          cat one.txt
          if command -v sha256sum >/dev/null; then sha256sum -c one.txt; else shasum -a 256 -c one.txt; fi
      - name: Smoke ${{ matrix.target }} (${{ matrix.mode }})
        shell: bash
        env:
          REQUIRE_NON_LOOPBACK: ${{ matrix.require }}
        run: |
          set -euo pipefail
          chmod +x "binaries/reebeat-studio-${{ matrix.target }}${{ matrix.ext }}"
          bash apps/launcher/scripts/smokeBinary.sh "binaries/reebeat-studio-${{ matrix.target }}${{ matrix.ext }}" ${{ matrix.mode }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: binaries
      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" binaries/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned binaries (macOS and Windows will warn). Verify with SHA256SUMS.txt. ffmpeg is not bundled."
